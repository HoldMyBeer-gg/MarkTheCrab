[package]
name = "markthecrab"
version = "0.2.10"
edition = "2024"

# The app logic lives in a library so mobile targets (iOS/Android) can link
# it as their entry point. Desktop builds link the same lib from main.rs.
# staticlib -> iOS, cdylib -> Android, rlib -> the desktop binary.
[lib]
name = "markthecrab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
markdown-core = { path = "../crates/markdown-core", features = ["simd"] }

# macOS-only: raise the native emoji/character picker from a Tauri command.
# Versions are pinned to what Tauri already resolves so no extra crates are
# pulled into the build.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
